# Builds the site (including fresh GitHub repo stats) and deploys it to GitHub Pages.
name: Build and deploy site

on:
  push:
    branches: ["main"]
  schedule:
    # Every day at 04:00 UTC, so repo stats stay up to date.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # To commit the screenshots.
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch GitHub data and build
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      # Light and dark screenshots of the homepage for the README.
      - name: Screenshot homepage
        run: |
          python3 -m http.server 8080 --directory out >/dev/null 2>&1 &
          sleep 2
          mkdir -p docs
          for theme in light dark; do
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1440,1000 --virtual-time-budget=10000 \
              --screenshot="$PWD/docs/screenshot-$theme.png" "http://localhost:8080/?theme=$theme"
            test -s "docs/screenshot-$theme.png"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      # Pushes made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
      - name: Commit screenshots
        if: github.ref == 'refs/heads/main'
        run: |
          git add docs/screenshot-*.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update homepage screenshots"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
